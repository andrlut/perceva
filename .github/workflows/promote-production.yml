name: Promote to Production

# Ships the current main to the Play Store app over-the-air.
#
# CI already auto-publishes every merge to the `preview` channel (internal
# APK). Nothing ever reached `production` — the channel the Play Store build
# actually listens on — so shipped fixes sat invisible to real users. This is
# the manual promote step: Actions → Promote to Production → Run workflow.
#
# JS/TS only. Native changes (new deps, app.json, SDK bumps) still need a
# fresh `eas build` + a Play Store release.

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message shown in the EAS dashboard'
        required: false
        default: ''
      confirm:
        description: 'Type "production" to confirm this reaches Play Store users'
        required: true
      newRuntimeOk:
        description: 'Only if app.json version moved AND the matching build is already live in the Play Store'
        type: boolean
        required: false
        default: false

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'production'
        run: |
          echo "::error::Confirmation did not match. Type exactly: production"
          exit 1

  promote:
    name: Publish OTA Update (production)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 22, not 20: `eas-version: latest` resolves at run time, and eas-cli 22.3
      # pulls @oclif/plugin-autocomplete, which declares engines.node >= 22. On
      # Node 20 the install aborts with "Found incompatible module" and the
      # promote never reaches `eas update`. This stayed hidden while the action's
      # eas-cli cache kept being restored — the first job to miss the cache
      # installs fresh and fails.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A native-affecting change published as an OTA is a silent no-op at
      # best: the running binary ignores an update whose runtimeVersion does
      # not match. Fail loudly instead of pretending the fix shipped.
      - name: Reject native changes since the last production build
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(app/app\.json|app/app\.config\.[jt]s|app/eas\.json|package\.json|pnpm-lock\.yaml|app/package\.json)$'; then
            echo "::error::Native/config change detected in the last commit. OTA cannot ship this — run 'eas build --profile production' and release through the Play Console."
            git diff --name-only HEAD~1 HEAD
            exit 1
          fi

      # The file check above only sees the LAST commit, so a native change
      # merged a few commits back slips past it. This one checks the thing that
      # actually decides whether an update is reachable: the runtimeVersion.
      #
      # `runtimeVersion.policy: appVersion` means runtime == app.json version.
      # An update is only delivered to a binary with the SAME runtime, so if
      # app.json has moved ahead of what production is currently serving, this
      # publish would be a silent no-op — the fix looks shipped and reaches
      # nobody. That is exactly what happened when react-native-purchases went
      # in with a 1.2.0 -> 1.3.0 bump (#354).
      #
      # The mismatch is legitimate exactly once: right after the matching build
      # is released to the Play Store. That case passes `newRuntimeOk`.
      - name: Reject a runtime the installed binary cannot receive
        working-directory: app
        env:
          NEW_RUNTIME_OK: ${{ inputs.newRuntimeOk }}
        run: |
          set -euo pipefail
          LOCAL_RUNTIME=$(node -e "const v=require('./app.json').expo; const p=v.runtimeVersion; console.log(typeof p==='string'?p:(p&&p.policy==='appVersion'?v.version:''))")
          if [ -z "$LOCAL_RUNTIME" ]; then
            echo "::warning::Could not resolve a runtimeVersion from app.json (non-appVersion policy?). Skipping this guard."
            exit 0
          fi
          LIVE_RUNTIME=$(npx eas update:list --branch production --limit 1 --json --non-interactive             | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const g=(j.currentPage||j)[0]||{};console.log(g.runtimeVersion||((g.updates||[{}])[0]||{}).runtimeVersion||'')})")
          echo "app.json runtime: $LOCAL_RUNTIME | production is serving: $LIVE_RUNTIME"
          if [ -n "$LIVE_RUNTIME" ] && [ "$LOCAL_RUNTIME" != "$LIVE_RUNTIME" ] && [ "$NEW_RUNTIME_OK" != "true" ]; then
            echo "::error::runtimeVersion moved ($LIVE_RUNTIME -> $LOCAL_RUNTIME). Installed binaries on $LIVE_RUNTIME would IGNORE this update. Ship 'eas build --profile production' + a Play Store release first, then re-run with newRuntimeOk=true."
            exit 1
          fi

      - name: Publish to production channel
        working-directory: app
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://uneqnpyzevosznwkmvvo.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_sWLt4U0F5J4S-Se-6V7SXw_1LyQqysV
          # Web client ID (público) — sem ele o eas update esconde o botão Google
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 961793707652-c617r29esfgrcqv4ls923unourufljrd.apps.googleusercontent.com
          # Via env, not inline `${{ }}` — a quote or backtick in the message
          # would otherwise be pasted straight into the shell body.
          INPUT_MESSAGE: ${{ inputs.message }}
        run: |
          MSG="$INPUT_MESSAGE"
          if [ -z "$MSG" ]; then
            MSG="$(git log -1 --pretty=%s)"
          fi
          eas update --channel production --message "$MSG" --non-interactive

      - name: Summary
        run: |
          {
            echo "### Promoted to production"
            echo ""
            echo "- Commit: \`$(git rev-parse --short HEAD)\` $(git log -1 --pretty=%s)"
            echo "- Channel: \`production\` (Play Store app)"
            echo ""
            echo "Reaches users on next app open — the bundle downloads in the"
            echo "background and applies on the following launch, so it can take"
            echo "two opens to appear."
            echo ""
            echo "Rollback: \`eas update --channel production --republish --group <previous-group-id>\`"
          } >> "$GITHUB_STEP_SUMMARY"
